/* Idea: el mismo póster de la landing (papel beige, bloques planos, tipografía negra condensada), pero convertido en cuaderno de trabajo: una ficha por espacio, móvil primero, una sola columna. */
:root{
  --paper:#F1E8DF; --ink:#2C2825; --teal:#09A7A2; --orange:#F89A3C; --red:#F74544;
  --lime:#B8EC03; --purple:#B500F8; --navy:#021233; --cyan:#02CFF2; --green:#1E8E55;
  --display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;font-weight:450;font-stretch:100%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .55 0'/></filter><rect width='280' height='280' filter='url(%23n)' opacity='.35'/></svg>")}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
.disp{font-family:var(--display);font-weight:900;font-stretch:68%;text-transform:uppercase;letter-spacing:.005em;line-height:.95}
.wide{font-family:var(--display);font-weight:800;font-stretch:118%;text-transform:uppercase;letter-spacing:.02em}
[hidden]{display:none!important}

/* portada */
.hero{padding-top:30px}
.logos{display:flex;align-items:center;gap:26px}
.logos img{display:block;height:46px;width:auto}
.logos img.pl{height:50px}
.pillrow{position:relative;margin-top:30px;padding-right:34px}
.pill{display:block;border:1.5px solid var(--ink);border-radius:50%;padding:14px 20px 13px;text-align:center;color:var(--teal);font-size:clamp(16px,5vw,24px);line-height:1;background:rgba(241,232,223,.6)}
.star{position:absolute;right:-2px;top:-22px;width:54px;height:54px;transform:rotate(-8deg)}
.title{display:block;width:calc(100% + 36px);margin:6px -18px 0;height:auto;overflow:visible}
.title text{font-family:var(--display);font-weight:900;font-stretch:62%;fill:var(--ink)}
.dates{display:block;margin:2px -18px 0 auto;width:min(94%,440px);background:var(--teal);color:var(--paper);padding:13px 18px;text-align:center;font-size:clamp(14px,4.2vw,19px);line-height:1.1}
.intro{margin:24px 0 0;font-size:19px;line-height:1.35;font-weight:600;max-width:30em}
.sec{margin-top:40px}
.sec>h2{margin:0 0 14px;font-size:clamp(30px,9vw,42px)}
.sec>h2 small{display:block;font-family:var(--body);font-stretch:100%;text-transform:none;font-weight:500;font-size:15px;line-height:1.4;letter-spacing:0;margin-top:8px}
.steps{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(44,40,37,.35);font-weight:550}
.steps b{font-family:var(--display);font-weight:900;font-stretch:68%;font-size:34px;line-height:1}
.deadline{margin-top:18px;background:var(--ink);color:var(--paper);padding:14px 16px;font-weight:550;line-height:1.35}
.deadline b{color:var(--lime);font-weight:800}
.deadline .cd{display:block;margin-top:4px;font-family:var(--display);font-weight:900;font-stretch:68%;text-transform:uppercase;font-size:30px;line-height:1;color:var(--lime)}
.teams{display:grid;gap:12px}
.pickteam{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid var(--ink);background:rgba(255,255,255,.4);padding:12px 14px;min-height:68px}
.pickteam:hover,.pickteam:active{background:rgba(9,167,162,.18)}
.pickteam .n{font-family:var(--display);font-weight:900;font-stretch:68%;font-size:44px;line-height:.9;text-transform:uppercase}
.pickteam .who{font-weight:700;line-height:1.2;padding:0}
.pickteam small{display:block;font-weight:500;font-size:13.5px}
.tag{flex:none;font-family:var(--body);font-stretch:118%;font-weight:800;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:99px;padding:3px 9px 2px}
.tag.lead{background:var(--teal);border-color:var(--teal);color:var(--ink)}
.help{margin:16px 0 0;font-size:14.5px}
.bar{height:22px;background:linear-gradient(to right,var(--orange) 0 5.5%,var(--red) 5.5% 10.5%,var(--lime) 10.5% 17.5%,var(--purple) 17.5% 23%,var(--navy) 23% 45%,#fff 45% 72%,var(--cyan) 72% 100%)}
.bar.thin{height:5px}
.foot{margin-top:50px}
.credit{padding:14px 0 28px;font-size:14px;text-align:center;font-weight:550}

/* barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
.top .mark{font-size:30px}
.switch{display:inline-flex;align-items:center;min-height:38px;padding:0 15px;border:1.5px solid var(--ink);border-radius:99px;background:none;font-weight:700;font-size:13px;letter-spacing:.03em}
.switch:active{background:rgba(9,167,162,.2)}

/* equipo */
.head{padding-top:24px}
.head .pill{display:inline-block;padding:10px 24px 9px;font-size:clamp(14px,4vw,18px)}
.head h1{margin:14px 0 0;font-size:clamp(40px,12.5vw,64px);overflow-wrap:anywhere}
.head .role{display:inline-block;margin:14px -18px 0 0;background:var(--teal);color:var(--paper);padding:10px 22px 9px 18px;font-size:clamp(13px,4vw,18px)}
.progress{margin-top:22px;border:2px solid var(--ink);background:rgba(255,255,255,.4);padding:13px 14px 14px}
.progress h3{margin:0 0 9px;font-family:var(--body);font-stretch:118%;font-weight:800;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;height:16px;border:1.5px solid var(--ink);background:#fff;overflow:hidden}
.seg i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:13.5px;font-weight:600}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--c);border:1px solid var(--ink)}
.big-num{font-family:var(--display);font-weight:900;font-stretch:68%;font-size:34px;line-height:1;text-transform:uppercase}
details.box{margin-top:14px;border:2px solid var(--ink);background:rgba(255,255,255,.4)}
details.box>summary{list-style:none;cursor:pointer;padding:14px 15px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"+";font-size:26px;line-height:1;font-weight:500}
details.box[open]>summary::after{content:"–"}
details.box .in{padding:0 15px 16px}
.rules{margin:0;padding-left:20px}.rules li{margin:5px 0}
.box{border:2px solid var(--ink);background:rgba(255,255,255,.4)}
.plain{margin-top:14px;padding:14px 15px 15px}
.plain h3{margin:0 0 8px;font-family:var(--body);font-stretch:118%;font-weight:800;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:800;font-size:15px;letter-spacing:.02em}
.btn:active{transform:translateY(1px)}
.btn.alt{background:rgba(255,255,255,.6);color:var(--ink)}
.btn.go{background:var(--teal);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

/* pestañas y tarjetas */
.days{margin-top:36px}
.days>h2{margin:0 0 14px;font-size:clamp(30px,9vw,42px)}
.tabs{position:sticky;top:52px;z-index:15;background:var(--paper);display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink);margin:0 -2px}
.tab{position:relative;min-height:58px;padding:7px 2px 6px;background:var(--paper);border:0;border-left:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1}
.tab:first-child{border-left:0}
.tab .d{font-family:var(--display);font-weight:900;font-stretch:68%;font-size:23px;text-transform:uppercase}
.tab .n{font-weight:800;font-size:12px;letter-spacing:.06em;font-stretch:118%}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] .n{color:var(--lime)}
.tab.empty{opacity:.45}
.panel{margin-top:16px;display:grid;gap:14px}
.card{border:2px solid var(--ink);background:rgba(255,255,255,.45)}
.stripe{height:9px;background:var(--c)}

}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop = n => '$' + Math.round(n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const toMin = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const f12 = min => { let h = Math.floor(min / 60), m = min % 60; const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + String(m).padStart(2, '0') + ' ' + ap; };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const num = v => { const n = Number(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : 0; };

function matTotal(p){
  if(!p || p.sinMat) return 0;
  return (p.ma || []).reduce((s, r) => s + (r.s === 'T' ? 0 : num(r.c) * num(r.u)), 0);
}
function coverage(iv, w0, w1){
  const a = iv.filter(x => x[1] > x[0]).sort((x, y) => x[0] - y[0]); let tot = 0, cur = null;
  a.forEach(x => { if(!cur) cur = x.slice(); else if(x[0] <= cur[1]) cur[1] = Math.max(cur[1], x[1]); else { tot += cur[1] - cur[0]; cur = x.slice(); } });
  if(cur) tot += cur[1] - cur[0];
  return w1 > w0 ? tot / (w1 - w0) : 0;
}
const L = (s, n) => String(s || '').trim().length >= n;

/* Valida una propuesta. E = errores que impiden enviar. W = avisos. */
function validate(p, sp, a){
  const E = [], W = []; const light = sp.mode === 'light'; const [w0, w1] = a.win;
  p = p || {};
  if(!L(p.idea, 15)) E.push('Cuenta la idea en una o dos frases.');
  if(!light && !L(p.obj, 10)) E.push(a.fn === 'ninos' ? 'Falta el principio bíblico y la enseñanza.' : 'Falta cómo atraes, conversas y oras con la gente.');
  if(sp.tema && !L(p.tema, 10)) E.push('Falta tu propuesta de temática o contenido.');
  const rows = p.mm || [], iv = []; let okRows = 0;
  rows.forEach((r, i) => {
    const x = toMin(r.a), y = toMin(r.b), n = 'Paso ' + (i + 1) + ': ';
    if(x == null || y == null || !L(r.q, 3)){ E.push(n + 'completa hora de inicio, fin y qué pasa.'); return; }
    if(y <= x){ E.push(n + 'la hora de fin debe ser después de la de inicio.'); return; }
    if(x < w0 - 45 || y > w1 + 15){ E.push(n + 'queda fuera del bloque (' + f12(w0) + ' a ' + f12(w1) + ', con hasta 45 min de montaje antes).'); return; }
    okRows++; iv.push([Math.max(x, w0), Math.min(y, w1)]);
  });
  const cover = coverage(iv, w0, w1);
  if(!light){
    if(okRows < 2) E.push('El minuto a minuto necesita al menos 2 pasos.');
    else if(cover < 0.8) W.push('Tu minuto a minuto cubre ' + Math.round(cover * 100) + '% del bloque. Si el resto no es tuyo, deja una línea que diga de quién es.');
  }
  if(!(p.pe || []).some(r => r.p && L(r.r, 3))) E.push('Indica quién del equipo hace qué.');
  if(!p.sinMat){
    const ma = p.ma || [];
    if(!ma.length) E.push('Agrega los materiales o marca "No necesitamos materiales".');
    ma.forEach((r, i) => {
      const n = 'Material ' + (i + 1) + ': ';
      if(!L(r.i, 2)){ E.push(n + 'falta el nombre.'); return; }
      if(!(num(r.c) > 0)){ E.push(n + 'falta la cantidad exacta.'); return; }
      if(!L(r.t, 2)){ E.push(n + 'falta tipo o tamaño.'); return; }
      if(!r.s){ E.push(n + 'indica dónde se consigue.'); return; }
      if(r.s !== 'T' && (r.u === '' || r.u == null || num(r.u) < 0)) E.push(n + 'falta el precio unitario.');
    });
  }
  const total = matTotal(p);
  return {E, W, total, cover};
}

  if(m[2] === '1'){

const KEY = 'choco2026-propuestas-v1';
let ST = {team:null, drafts:{}, sent:{}, pool:{}};
let view = {n:'home'};
try { const s = localStorage.getItem(KEY); if(s) ST = Object.assign(ST, JSON.parse(s)); } catch(e) {}
let saveT = null;
function saveST(now){ clearTimeout(saveT); const go = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch(e) {} }; if(now) go(); else saveT = setTimeout(go, 300); }
const $ = (s, r) => (r || document).querySelector(s);
const app = $('#app');

const STATUS = {none:'Sin empezar', draft:'Borrador', dirty:'Cambios sin enviar', sent:'Enviada'};
const STCLS = {none:'none', draft:'draft', dirty:'draft', sent:'sent'};
function statusOf(u){
  const d = ST.drafts[u], s = ST.sent[u];
  if(!d) return 'none';
  if(!s) return 'draft';
  if(d.dirty) return 'dirty';
  return 'sent';
}
const stPill = u => { const k = statusOf(u); return '<span class="st ' + STCLS[k] + '">' + STATUS[k] + '</span>'; };
const fnChip = (a) => { const f = FN[a.fn]; return '<span class="chip" style="--c:' + f.c + ';--f:' + f.f + '">' + f.n + (a.turno ? ' · turno ' + a.turno : '') + '</span>'; };
function cdText(){
  const ms = DEADLINE - Date.now();
  if(ms <= 0) return 'Plazo cerrado';
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mi = m % 60;
  return (d ? d + ' d ' : '') + h + ' h ' + mi + ' min';
}
setInterval(() => document.querySelectorAll('[data-cd]').forEach(el => { el.textContent = cdText(); }), 30000);

let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }

/* ---------- vistas ---------- */
const bar = thin => '<div class="bar' + (thin ? ' thin' : '') + '" aria-hidden="true"></div>';
function topbar(btn){ return '<div class="top"><div class="wrap"><span class="mark disp">Chocó</span>' + btn + '</div>' + bar(true) + '</div>'; }

function homeV(){
  const teams = [1,2,3,4,5].map(t => {
    const n = unitsFor(t).length;
    return '<button class="pickteam" data-act="team" data-t="' + t + '"><span class="n">E' + t + '</span><span class="who"><b>' + esc(TEAMS[t].lider) + '</b><small>' + n + ' propuestas por preparar</small></span><span class="tag lead">Líder</span></button>';
  }).join('');
  return '<main><header class="wrap hero">' +
    '<div class="logos"><img src="' + LOGO_NB + '" alt="New Breath"><img class="pl" src="' + LOGO_PL + '" alt="Puente Largo"></div>' +
    '<div class="pillrow"><span class="pill wide">Propuestas de equipo</span><svg class="star" viewBox="0 0 100 100" aria-hidden="true"><polygon fill="#09A7A2" points="50.0,0.0 58.0,30.6 85.4,14.6 69.4,42.0 100.0,50.0 69.4,58.0 85.4,85.4 58.0,69.4 50.0,100.0 42.0,69.4 14.6,85.4 30.6,58.0 0.0,50.0 30.6,42.0 14.6,14.6 42.0,30.6"/></svg></div>' +
    '<svg class="title" viewBox="0 -118 1000 478" role="img" aria-label="Chocó"><text x="0" y="350" font-size="520" textLength="1000" lengthAdjust="spacingAndGlyphs">CHOCÓ</text></svg>' +
    '<span class="dates wide">Entrega: lunes 9 de noviembre</span>' +
    '<p class="intro">Aquí preparas la propuesta de tu equipo para cada espacio y se la envías a Mateo.</p></header>' +
    '<div class="wrap">' +
    '<section class="sec"><h2 class="disp">Cómo funciona</h2><ol class="steps">' +
    '<li><b>1</b><span><strong>Prepara cada ficha.</strong> Son 8 o 9 por equipo. Se guardan solas en este celular.</span></li>' +
    '<li><b>2</b><span><strong>Envía todo el equipo</strong> con un solo código y mándaselo a Mateo por WhatsApp. Él te da su retroalimentación por ahí mismo.</span></li></ol>' +
    '<div class="deadline">Las propuestas se reciben hasta el <b>lunes 9 de noviembre a las 12:00 a. m.</b> (medianoche del domingo 8).<span class="cd" data-cd>' + cdText() + '</span></div></section>' +
    '<section class="sec"><h2 class="disp">¿Cuál es tu equipo?<small>Entra con el nombre de tu líder. Si no eres líder, tu líder envía por el equipo.</small></h2><div class="teams">' + teams + '</div></section>' +
    '</div><div class="foot">' + bar() + '<p class="credit">Misión Nacional Chocó · Puente Largo y New Breath</p><p class="credit"><button class="ghost" data-act="allopen">Revisión</button></p></div></main>';
}

function rulesHTML(){
  return '<ul class="rules">' +
    '<li><b>Precios fijos</b> y cantidades exactas con tipo o tamaño. Nada de rangos.</li>' +
    '<li><b>Las compras</b> se hacen el martes 24 en Quibdó. Si algo se trae de Bogotá, márcalo.</li>' +
    '<li><b>Seguridad:</b> caminar por la zona solo hasta las 9 pm. Salir de Reposo Dos antes de las 6 pm.</li>' +
    '<li><b>Agua:</b> cada quien lleva su botella llena. Nada de bolis, helados ni hielo de la calle.</li>' +
    '<li><b>Equidad:</b> lo que reciben los niños lo recibe también el equipo.</li>' +
    '<li><b>Dulces y premios:</b> no se repiten con otro equipo. Mateo los consolida.</li>' +
    '<li><b>Artes y Medios</b> entregan su propuesta por aparte.</li></ul>';
}

function teamV(){
  const t = ST.team, T = TEAMS[t], units = unitsFor(t), tab = view.tab || (DAYS.find(d => units.some(u => u.sp.day === d.k)) || DAYS[0]).k;
  const counts = {sent:0, draft:0, none:0}; let sentN = 0;
  units.forEach(u => { const k = statusOf(u.id); if(ST.sent[u.id]) sentN++; if(k === 'sent') counts.sent++; else if(k === 'draft' || k === 'dirty') counts.draft++; else counts.none++; });
  const N = units.length, RD = readiness(t), pct = n => (n / N * 100).toFixed(1) + '%';
  const seg = [[counts.sent, 'var(--navy)', 'Enviadas'], [counts.draft, 'var(--orange)', 'En borrador'], [counts.none, '#fff', 'Sin empezar']];
  const tabs = '<div class="tabs" role="tablist" aria-label="Días de la misión">' + DAYS.map(d => {
    const c = units.filter(u => u.sp.day === d.k).length;
    return '<button class="tab' + (c ? '' : ' empty') + '" role="tab" aria-selected="' + (d.k === tab) + '" data-act="tab" data-k="' + d.k + '"><span class="d">' + d.short + '</span><span class="n">' + d.num + '</span></button>';
  }).join('') + '</div>';
  const dayUnits = units.filter(u => u.sp.day === tab);
  const cards = dayUnits.map(u => {
    const f = FN[u.a.fn], sp = u.sp, st = statusOf(u.id);
    return '<article class="card" style="--c:' + f.c + '"><div class="stripe" aria-hidden="true"></div><div class="card-in">' +
      '<h3 class="disp">' + esc(sp.title) + '</h3>' +
      '<div class="meta"><span class="fr wide">' + esc(u.a.hora) + '</span><span class="dur">' + esc(sp.dur) + '</span>' + fnChip(u.a) + (sp.mode === 'light' ? '<span class="tag">Ficha corta</span>' : '') + '</div>' +
      '<p class="rol">' + esc(u.a.rol) + '</p>' +
      '<div class="cardfoot">' + stPill(u.id) + '<button class="btn' + (st === 'none' ? ' go' : ' alt') + '" data-act="open" data-u="' + u.id + '">' + (st === 'none' ? 'Preparar propuesta' : 'Editar propuesta') + '</button></div></div></article>';
  }).join('');
  const logi = SP.filter(s => s.day === tab && (s.logi || []).includes(t)).map(s =>
    '<div class="logi"><b>Apoyo logístico · ' + esc(s.title) + '.</b> No lleva propuesta. Pregunta a Mateo cómo apoyar con el montaje' + (s.id === 'aposento' ? (t === 3 ? ' y el refrigerio del receso (parte del equipo: <span class="tbc">por confirmar</span> quiénes)' : ' y el refrigerio del receso') : '') + '.</div>').join('');
  return '<main>' + topbar('<button class="switch" data-act="home">Cambiar de equipo</button>') + '<div class="wrap">' +
    '<header class="head"><span class="pill wide">Equipo ' + t + '</span><h1 class="disp">' + esc(T.lider) + '</h1><span class="role wide">Líder · ' + N + ' propuestas</span></header>' +
    '<section class="progress"><h3>Tu avance</h3><div class="big-num">' + sentN + ' de ' + N + ' enviadas</div><div class="seg" style="margin-top:10px" aria-hidden="true">' +
    seg.map(s => '<i style="width:' + pct(s[0]) + ';background:' + s[1] + '"></i>').join('') + '</div><div class="legend">' +
    seg.filter(s => s[0]).map(s => '<span style="--c:' + s[1] + '">' + s[0] + ' ' + s[2].toLowerCase() + '</span>').join('') + '</div>' +
    '<p style="margin:10px 0 0;font-size:14.5px;font-weight:600">Cierra en <span data-cd>' + cdText() + '</span> (lunes 9, 12:00 a. m.)</p></section>' +
    '<details class="box"><summary>Reglas para todas las propuestas</summary><div class="in">' + rulesHTML() + '</div></details>' +
    '<section class="box plain"><h3>Enviar a Mateo</h3><p style="margin:0;font-size:14.5px">Cuando termines, envías todas tus fichas completas en <b>un solo código</b>. Tienes ' + RD.ready.length + ' de ' + N + ' listas.</p><div class="btnrow"><button class="btn go" data-act="sendteam"' + (RD.ready.length ? '' : ' disabled') + '>' + (sentN ? 'Enviar de nuevo' : 'Enviar todo el equipo') + '</button></div></section>' +
    '<section class="days"><h2 class="disp">Tus espacios por día</h2>' + tabs + '<div class="panel">' + (cards || '') + logi + (!cards && !logi ? '<div class="logi">Este día no tienes propuestas.</div>' : '') + '</div></section></div>' +
    '<div class="foot">' + bar() + '<p class="credit">¿Dudas? Pregunta a Mateo Laverde.</p></div></main>';
}

/* ---------- ficha ---------- */
function newDraft(info){
  const light = info.sp.mode === 'light';
  return {idea:'', obj:'', tema:'', mm:light ? [] : [{a:'',b:'',q:'',p:''}, {a:'',b:'',q:'',p:''}], pe:[{p:'',r:''}], ma:[], sinMat:false, nec:'', dirty:false};
}
function ensureDraft(u, info){ if(!ST.drafts[u]) ST.drafts[u] = newDraft(info); return ST.drafts[u]; }
const memberOpts = (t, sel) => '<option value="">Elige…</option>' + TEAMS[t].miembros.map(m => '<option' + (m === sel ? ' selected' : '') + '>' + esc(m) + '</option>').join('');

const AV = {tab:'resumen', space:'cuatro', shop:'todas', demo:false, res:null};
let DOCS = {}, DEMODOCS = null;
function buildDocs(){
  if(AV.demo && DEMODOCS) return (DOCS = DEMODOCS);

  Object.keys(ST.pool || {}).forEach(id => { o[id] = ST.pool[id]; });
  Object.keys(ST.sent || {}).forEach(id => {
    const s = ST.sent[id]; if(!s || !s.p || !unitInfo(id)) return;
    const ex = o[id]; if(ex && ex.rev > s.rev) return;
    o[id] = {t:s.p.t, u:s.p.u, rev:s.rev, ts:s.ts, recv:s.ts, late:s.p.late || 0, d:s.p};
  });
  return (DOCS = o);
}
const when = ts => new Date(ts).toLocaleString('es-CO', {weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'});
const CANDY = /dulce|caramelo|paleta|chocolat|galleta|premio|bombon|gomita|chicle|confite|obsequio|regalo/;
const lbl = id => { const i = unitInfo(id); return 'Eq. ' + i.team + ' · ' + i.sp.title; };
function allRows(except){
  const out = [];
  Object.keys(DOCS).forEach(id => { if(id === except) return; (DOCS[id].d.ma || []).forEach(r => out.push({id, r, x:DOCS[id]})); });
  return out;
}
function alertsFor(id){
  const x = DOCS[id], info = unitInfo(id), P = x.d, out = []; if(!info) return out;
  const v = validate(P, info.sp, info.a);
  if(x.late) out.push(['bad', 'Tardía', 'Llegó el ' + when(x.ts) + ', después del cierre del lunes 9 a las 12:00 a. m.']);
  v.E.forEach(e => out.push(['bad', 'Falta o no cuadra', e]));
  v.W.forEach(w => out.push(['warn', 'Tiempo', w]));
  if(v.total > TOPE_MAX) out.push(['bad', 'Costo', 'Supera el tope de ' + cop(TOPE_MAX) + ' (' + cop(v.total) + ').']);
  else if(v.total > TOPE_OK) out.push(['warn', 'Costo', 'Pasa de ' + cop(TOPE_OK) + ' (' + cop(v.total) + ').']);
  if(info.sp.asist && v.total > 0) out.push(['info', 'Escala', cop(v.total / info.sp.asist) + ' por persona esperada (base ' + info.sp.asist + ' personas).']);
  const others = allRows(id), seen = {};
  (P.ma || []).forEach(r => {
    const n = norm(r.i); if(!n) return;
    const same = others.filter(o => norm(o.r.i) === n);
    const cand = CANDY.test(n) ? others.filter(o => CANDY.test(norm(o.r.i)) && unitInfo(o.id) && unitInfo(o.id).sp.day === info.sp.day) : [];
    const list = same.concat(cand.filter(c => !same.includes(c)));
    if(list.length && !seen[n]){ seen[n] = 1; out.push(['warn', CANDY.test(n) ? 'Dulces o premios repetidos' : 'Material repetido', '“' + r.i + '” también aparece en ' + list.slice(0, 4).map(o => lbl(o.id)).join(', ') + (list.length > 4 ? ' y ' + (list.length - 4) + ' más' : '') + '. Hay que ver si se consolida o se reutiliza.']); }
  });
  if((P.ma || []).some(r => r.re)) out.push(['info', 'Reutilización', 'Marcó materiales como reutilizables: ' + P.ma.filter(r => r.re).map(r => r.i).join(', ') + '.']);
  if(!out.some(a => a[0] === 'bad' || a[0] === 'warn')) out.unshift(['ok', 'Sin alertas', 'Tiempo, costo y campos obligatorios están en orden.']);
  return out;
}
const lvOf = id => { if(!DOCS[id]) return 'none'; const a = alertsFor(id); return a.some(x => x[0] === 'bad') ? 'bad' : a.some(x => x[0] === 'warn') ? 'warn' : 'ok'; };

async function importText(txt){
  const toks = extractTokens(txt).filter(t => t.startsWith('CHO')), res = [];
  if(!toks.length) return [{st:'none'}];
  if(!ST.pool) ST.pool = {};
  for(const t of toks){
    let list = [];
    try { const {data} = await unpack(t); list = data.k === 'pp' ? (data.ps || []) : [data]; } catch(e) { res.push({st:'bad'}); continue; }
    list.forEach(P => {
      try {
        const id = 't' + P.t + '-' + P.u;
        if(P.k !== 'p' || !unitInfo(id)) throw new Error('forma');
        const ex = ST.pool[id] || DOCS[id];
        if(ex && (ex.rev > P.rev || (ex.rev === P.rev && ex.ts >= P.ts))){ res.push({id, st:'dup', rev:P.rev}); return; }
        ST.pool[id] = {t:P.t, u:P.u, rev:P.rev, ts:P.ts, recv:Date.now(), late:P.ts > DEADLINE ? 1 : 0, d:P};
        res.push({id, st:ex ? 'upd' : 'new', rev:P.rev});
      } catch(e) { res.push({st:'bad'}); }
    });
  }
  saveST(true); return res;
}

function buildP(id, D, v, rev, ts){

async function sendTeam(){
  const t = ST.team, R = readiness(t);
  if(!R.ready.length){ toast('Todavía no tienes ninguna ficha completa.'); return; }
  const ps = [], ts = Date.now();
  R.ready.forEach(({u, v, D}) => {
    const prev = ST.sent[u.id];
    if(prev && !D.dirty && prev.p){ ps.push(prev.p); return; }
    const rev = (prev ? prev.rev : 0) + 1, P = buildP(u.id, D, v, rev, ts);
    ST.sent[u.id] = {rev, ts, code:'', total:v.total, p:P}; D.dirty = false; ps.push(P);
  });
  const code = await pack({k:'pp', t, ld:TEAMS[t].lider, ts, ps}, 'CHO');
  saveST(true); show(view, true);
  const pend = R.missing.concat(R.none.map(u => ({u}))).map(x => x.u.sp.title + (x.u.a.turno ? ' (turno ' + x.u.a.turno + ')' : ''));
  const text = 'PROPUESTAS · Equipo ' + t + ' · ' + ps.length + ' de ' + unitsFor(t).length + ' espacios\nLíder: ' + TEAMS[t].lider + '\n' + code;
  sheet('Equipo listo', text, {note: 'Un solo mensaje con ' + ps.length + (ps.length === 1 ? ' propuesta' : ' propuestas') + '. Pégalo en tu chat de WhatsApp con Mateo.' + (pend.length ? ' Faltan por completar: ' + pend.join(', ') + '. Cuando las termines, vuelve a tocar Enviar y manda el mensaje nuevo: reemplaza al anterior.' : '')});
}

document.addEventListener('click', async e => {

  if(b.dataset.act === 'copycode'){ const ok = await copyText($('#codeTxt').value); toast(ok ? 'Mensaje copiado. Pégalo en WhatsApp.' : 'No pude copiar solo: mantén pulsado el texto y elige Copiar.'); }
  else if(b.dataset.act === 'closesheet2'){ $('#sheetroot').innerHTML = ''; }
  else if(b.dataset.act === 'closesheet' && e.target === b){ $('#sheetroot').innerHTML = ''; }
});
app.addEventListener('input', onField);
app.addEventListener('change', onField);

show(ST.team && TEAMS[ST.team] ? {n:'team'} : {n:'home'});
